name: Daily AI Report Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# 同一时间只允许一个更新任务，避免连续触发导致 push 冲突
concurrency:
  group: daily-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - run: cd scripts && npm ci --no-audit --no-fund

      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd scripts && node generate-html.js

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ai-daily-dashboard.html || true
          git diff --cached --quiet && echo "无更新" && exit 0
          git commit -m "每天 08:00 自动更新"
          git push origin main

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=ai-daily-dashboard --branch=main
